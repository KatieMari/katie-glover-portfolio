<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title + description: edit these to suit you -->
    <title>Katie Glover — Creative Front-End Developer</title>
    <meta
      name="description"
      content="Katie Glover is a final-year Creative Computing student at Norwich University of the Arts who combines design and front-end development to build engaging, accessible web experiences."
    />
    <meta name="author" content="Katie Glover" />

    <!-- Theme colour for mobile browser UI (matches --color-bg in each theme) -->
    <meta name="theme-color" content="#faf3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211923" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicon (placeholder — swap public/favicon.svg for your own mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Social sharing. PLACEHOLDER: replace https://your-domain.example with your real URL once deployed -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Katie Glover — Creative Front-End Developer" />
    <meta
      property="og:description"
      content="Final-year Creative Computing student building thoughtful, playful and accessible web experiences."
    />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta property="og:image" content="https://your-domain.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Katie Glover — Creative Front-End Developer" />
    <meta
      name="twitter:description"
      content="Final-year Creative Computing student building thoughtful, playful and accessible web experiences."
    />
    <meta name="twitter:image" content="https://your-domain.example/og-image.png" />

    <!-- Fonts: Fraunces (expressive serif headings) + Plus Jakarta Sans (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap"
    />

    <!--
      Apply the saved/OS theme BEFORE the page paints, so there is no flash
      of the wrong theme. React takes over from here (see src/hooks/useTheme.js).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kg-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        This portfolio is built with React and needs JavaScript enabled to display.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
